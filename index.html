<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#ff6b35">
<title>火锅店管理 v2</title>
<link rel="manifest" href="manifest.json">
<script>if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js')}</script>
<style>
:root{--o:#ff6b35;--g:#4caf84;--b:#5b9cf5;--r:#f05b5b;--bg:#f5f5f5;--card:#fff;--t:#333;--d:#999}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--t);padding-bottom:60px;max-width:100vw;overflow-x:hidden}
header{background:linear-gradient(135deg,#e8551f,#ff6b35);color:#fff;padding:12px 16px;position:sticky;top:0;z-index:10;display:flex;justify-content:space-between;align-items:center}
header h1{font-size:1.1rem;font-weight:600}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;border-top:1px solid #eee;z-index:10;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;padding:8px 4px;border:none;background:none;color:var(--d);font-size:.65rem;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;transition:color .2s}
nav button.active{color:var(--o)}
nav button .icon{font-size:1.3rem}
.page{display:none;padding:12px}
.page.active{display:block}
.card{background:var(--card);border-radius:10px;padding:14px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.card h3{font-size:.9rem;margin-bottom:8px;color:var(--o)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1;min-width:80px}
label{font-size:.7rem;color:var(--d);display:block;margin-bottom:2px}
input,select,textarea{width:100%;padding:8px 10px;border:1px solid #ddd;border-radius:6px;font-size:.85rem;background:#fafafa;margin-bottom:8px}
input:focus,select:focus{outline:none;border-color:var(--o);background:#fff}
.btn{display:inline-block;padding:8px 16px;border:none;border-radius:6px;font-size:.8rem;font-weight:600;cursor:pointer;text-align:center;transition:opacity .2s}
.btn-o{background:var(--o);color:#fff}
.btn-g{background:var(--g);color:#fff}
.btn-b{background:var(--b);color:#fff}
.btn-r{background:var(--r);color:#fff}
.btn-o1{border:1px solid var(--o);color:var(--o);background:#fff}
.btn-block{display:block;width:100%}
.btn-sm{padding:5px 10px;font-size:.7rem}
.btn:active{opacity:.7}
.list-item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #f0f0f0;font-size:.82rem}
.list-item:last-child{border-bottom:none}
.list-item .info{flex:1}
.list-item .title{font-weight:600}
.list-item .sub{font-size:.7rem;color:var(--d);margin-top:2px}
.list-item .val{font-weight:600;text-align:right;min-width:60px}
.list-item .val.in{color:var(--g)}
.list-item .val.out{color:var(--r)}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:.65rem;font-weight:600}
.badge-in{background:#4caf8415;color:var(--g)}
.badge-out{background:#f05b5b15;color:var(--r)}
.badge-warn{background:#ff6b3515;color:var(--o)}
.summary{display:flex;gap:8px;margin-bottom:12px}
.summary>div{flex:1;background:var(--card);border-radius:8px;padding:10px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.summary .num{font-size:1.2rem;font-weight:700}
.summary .lbl{font-size:.6rem;color:var(--d);margin-top:2px}
.empty{text-align:center;padding:40px 20px;color:var(--d);font-size:.85rem}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:100;align-items:flex-end}
.modal-overlay.show{display:flex}
.modal{background:#fff;width:100%;border-radius:14px 14px 0 0;padding:16px;max-height:85vh;overflow-y:auto}
.modal h3{font-size:.95rem;margin-bottom:12px;text-align:center}
.fab{position:fixed;bottom:80px;right:16px;width:48px;height:48px;border-radius:50%;background:var(--o);color:#fff;font-size:1.5rem;border:none;box-shadow:0 3px 12px rgba(255,107,53,.4);cursor:pointer;z-index:5;display:flex;align-items:center;justify-content:center}
.filter-row{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.filter-row select,.filter-row input{width:auto;flex:1;margin-bottom:0}
.tab-row{display:flex;gap:4px;margin-bottom:10px;overflow-x:auto}
.tab-row button{padding:6px 14px;border:1px solid #ddd;border-radius:16px;background:#fff;font-size:.75rem;white-space:nowrap;cursor:pointer}
.tab-row button.active{background:var(--o);color:#fff;border-color:var(--o)}
.toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:8px 20px;border-radius:20px;font-size:.8rem;z-index:200;opacity:0;transition:opacity .3s}
.toast.show{opacity:1}

.login-page{position:fixed;inset:0;z-index:1000;background:linear-gradient(180deg,rgba(139,0,0,.85) 0%,rgba(196,30,30,.8) 30%,rgba(212,68,42,.75) 50%,rgba(232,117,58,.7) 70%,rgba(245,166,35,.65) 100%),url(bg_login.jpg) center/cover;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff}
.login-page.hidden{display:none}
.login-bg{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 40%,rgba(255,215,0,.15) 0%,transparent 60%),radial-gradient(circle at 20% 80%,rgba(255,107,53,.2) 0%,transparent 40%),radial-gradient(circle at 80% 70%,rgba(255,69,0,.15) 0%,transparent 35%);pointer-events:none}
.login-card{position:relative;z-index:1;background:rgba(0,0,0,.35);backdrop-filter:blur(10px);border-radius:16px;padding:32px 24px;width:calc(100% - 48px);max-width:340px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.15)}
.login-emoji{font-size:3.5rem;margin-bottom:8px}
.login-card h2{font-size:1.4rem;margin-bottom:4px;font-weight:700;letter-spacing:2px}
.login-card .sub{font-size:.7rem;color:rgba(255,255,255,.6);margin-bottom:20px}
.login-dots{display:flex;justify-content:center;gap:12px;margin-bottom:20px}
.login-dot{width:14px;height:14px;border-radius:50%;border:2px solid rgba(255,255,255,.5);transition:all .2s}
.login-dot.filled{background:#FFD700;border-color:#FFD700;box-shadow:0 0 12px rgba(255,215,0,.5)}
.login-numpad{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px}
.login-numpad button{aspect-ratio:1;border-radius:50%;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.1);color:#fff;font-size:1.3rem;font-weight:600;cursor:pointer;transition:all .15s;-webkit-tap-highlight-color:transparent}
.login-numpad button:active{background:rgba(255,255,255,.3);transform:scale(.95)}
.login-numpad .del{font-size:.8rem}
.login-numpad .empty{background:transparent;border:none}
.login-msg{font-size:.7rem;color:#FFD700;min-height:20px;margin-top:4px}

</style>
</head>
<body>

<header><h1>🍲 火锅店管理</h1><span id="clock" style="font-size:.75rem"></span></header>

<nav>
<button class="active" onclick="switchTab('sz')"><span class="icon">💰</span>收支</button>
<button onclick="switchTab('yg')"><span class="icon">👥</span>员工</button>
<button onclick="switchTab('kc')"><span class="icon">🥩</span>库存</button>
<button onclick="switchTab('bb')"><span class="icon">📊</span>报表</button>
</nav>

<div class="toast" id="toast"></div>

<div class="login-page" id="loginPage">
  <div class="login-bg"></div>
  <div class="login-card">
    <div class="login-emoji">🍲</div>
    <h2>火锅店管理</h2>
    <div class="sub">请输入安全密码</div>
    <div class="login-dots" id="loginDots">
      <div class="login-dot"></div><div class="login-dot"></div><div class="login-dot"></div><div class="login-dot"></div><div class="login-dot"></div><div class="login-dot"></div>
    </div>
    <div class="login-numpad" id="loginNumpad"></div>
    <div class="login-msg" id="loginMsg"></div>
  </div>
  <div style="position:absolute;bottom:30px;color:rgba(255,255,255,.35);font-size:.6rem">Powered by Hotpot Manager</div>
</div>


<!-- ====== TAB 1: 收支 ====== -->
<div class="page active" id="tab-sz">
    <div class="summary" style="margin-bottom:4px">
    <div style="flex:2"><div class="num" style="font-size:.9rem" id="sz-budget">月预算:未设</div><div class="lbl" onclick="setBudget()" style="color:var(--b);cursor:pointer">点击设置</div></div>
  </div>
  <div class="summary">
    <div><div class="num" style="color:var(--g)" id="sz-in">0</div><div class="lbl">月收入</div></div>
    <div><div class="num" style="color:var(--r)" id="sz-out">0</div><div class="lbl">月支出</div></div>
    <div><div class="num" id="sz-bal">0</div><div class="lbl">收支差</div></div>
  </div>
  <div class="filter-row">
    <input id="sz-search" placeholder="🔍 搜索..." oninput="loadSZList()" style="flex:2">
    <select id="sz-filter-type" onchange="loadSZList()"><option value="">全部</option><option value="收入">收入</option><option value="支出">支出</option></select>
    <input type="month" id="sz-filter-month" onchange="loadSZList()">
  </div>
  <div id="sz-list"></div>
  <button class="fab" onclick="openSZModal()">+</button>
</div>

<!-- ====== TAB 2: 员工 ====== -->
<div class="page" id="tab-yg">
  <div class="tab-row" id="yg-subtabs">
    <button class="active" onclick="ygSubTab('info')">员工信息</button>
    <button onclick="ygSubTab('leave')">请假登记</button>
    <button onclick="ygSubTab('attend')">月考勤</button>
  </div>
  <div id="yg-info-list"></div>
  <div id="yg-leave-list" style="display:none"></div>
  <div id="yg-attend-list" style="display:none"></div>
  <button class="fab" id="yg-fab" onclick="openYGModal()">+</button>
</div>

<!-- ====== TAB 3: 库存 ====== -->
<div class="page" id="tab-kc">
  <div class="tab-row" id="kc-subtabs">
    <button class="active" onclick="kcSubTab('ingredient')">食材清单</button>
    <button onclick="kcSubTab('product')">产品管理</button>
    <button onclick="kcSubTab('bom')">配方BOM</button>
    <button onclick="kcSubTab('prodrec')">生产记录</button>
  </div>
  <div class="summary" id="kc-alert" style="display:none"><div style="background:#f05b5b15;border:1px solid #f05b5b30;border-radius:8px;padding:8px;text-align:center;color:var(--r);font-size:.75rem">⚠️ 以下食材低于安全库存</div></div>
  <div id="kc-ingredient-list"></div>
  <div id="kc-product-list" style="display:none"></div>
  <div id="kc-bom-list" style="display:none"></div>
  <div id="kc-prodrec-list" style="display:none"></div>
  <button class="fab" id="kc-fab" onclick="openModal('modal-kc-ing')">+</button>
</div>

<!-- ====== TAB 4: 报表 ====== -->
<div class="page" id="tab-bb">
  <div class="tab-row" id="bb-subtabs">
    <button class="active" onclick="bbSubTab('sz')">收支月报</button>
    <button onclick="bbSubTab('salary')">薪资报表</button>
    <button onclick="bbSubTab('stock')">库存台账</button>
  </div>
  <div class="filter-row"><input type="month" id="bb-month" onchange="loadReport()"><button class="btn btn-sm btn-b" onclick="exportCSV()">导出CSV</button></div>
  <div id="bb-content"></div>
</div>

<!-- ====== MODALS ====== -->
<div class="modal-overlay" id="modal-sz"><div class="modal">
  <h3 id="modal-sz-title">收支记录</h3>
  <select id="m-sz-type" onchange="updateSZCat()"><option value="">选择类型</option><option value="收入">收入</option><option value="支出">支出</option></select>
  <select id="m-sz-cat"><option value="">请先选择收支类型</option></select>
  <input type="number" id="m-sz-amt" placeholder="金额（元）" step="0.01">
  <input type="date" id="m-sz-date">
  <select id="m-sz-pay"><option value="">支付方式</option><option value="微信">微信</option><option value="支付宝">支付宝</option><option value="现金">现金</option><option value="银行卡">银行卡</option><option value="其他">其他</option></select>
  <input id="m-sz-person" placeholder="经手人">
  <input id="m-sz-note" placeholder="备注">
  <div class="row"><button class="btn btn-o btn-block" onclick="saveSZ()">保存</button><button class="btn btn-o1 btn-block" onclick="closeModal('modal-sz')">取消</button></div>

</div></div>

<div class="modal-overlay" id="modal-yg"><div class="modal">
  <h3 id="modal-yg-title">员工信息</h3>

  <input id="m-yg-role" placeholder="岗位（如：厨师/服务员）">

  <div class="row"><button class="btn btn-o btn-block" onclick="saveYG()">保存</button><button class="btn btn-o1 btn-block" onclick="closeModal('modal-yg')">取消</button></div>
  <input type="hidden" id="m-yg-id">
</div></div>

<div class="modal-overlay" id="modal-leave"><div class="modal">
  <h3>请假登记</h3>
  <select id="m-leave-emp"></select>
  <select id="m-leave-type"><option value="">请假类型</option><option value="事假">事假</option><option value="病假">病假</option><option value="年假">年假</option><option value="调休">调休</option><option value="其他">其他</option></select>

</div></div>

<div class="modal-overlay" id="modal-kc-ing"><div class="modal">
  <h3>食材信息</h3>
  <input id="m-ing-name" placeholder="食材名称（如：牛肉卷）">
  <input id="m-ing-cat" placeholder="分类（如：肉类/蔬菜/调料）">
  <input id="m-ing-unit" placeholder="单位（如：斤/袋/瓶）">

  <input type="number" id="m-ing-warn" placeholder="安全预警阈值" step="0.01">
  <input id="m-ing-note" placeholder="备注">

  <input type="hidden" id="m-ing-id">
</div></div>

<div class="modal-overlay" id="modal-kc-prod"><div class="modal">
  <h3>产品信息</h3>
  <input id="m-prod-name" placeholder="产品名称">
  <input id="m-prod-cat" placeholder="产品分类">

  <input type="number" id="m-prod-cost" placeholder="计算成本（元）" step="0.01">
  <input id="m-prod-note" placeholder="备注">

  <input type="hidden" id="m-prod-id">
</div></div>

<div class="modal-overlay" id="modal-kc-bom"><div class="modal">
  <h3>BOM配方</h3>
  <select id="m-bom-prod"></select>
  <select id="m-bom-ing"></select>
  <input type="number" id="m-bom-qty" placeholder="用量" step="0.001">
  <input id="m-bom-unit" placeholder="用量单位（如：克/毫升）">
  <input id="m-bom-note" placeholder="备注">
  <div class="row"><button class="btn btn-o btn-block" onclick="saveBOM()">保存</button><button class="btn btn-o1 btn-block" onclick="closeModal('modal-kc-bom')">取消</button></div>
  <input type="hidden" id="m-bom-id">
</div></div>

<div class="modal-overlay" id="modal-prodrec"><div class="modal">
  <h3>产品生产记录</h3>
  <select id="m-prodrec-prod"></select>
  <input type="number" id="m-prodrec-qty" placeholder="生产数量" step="1">
  <input type="date" id="m-prodrec-date">
  <input id="m-prodrec-note" placeholder="备注">
  <div style="background:#f5f5f5;border-radius:6px;padding:8px;margin:8px 0;font-size:.75rem;color:var(--d)" id="m-prodrec-cost-preview"></div>
  <div class="row"><button class="btn btn-o btn-block" onclick="saveProdRec()">保存</button><button class="btn btn-o1 btn-block" onclick="closeModal('modal-prodrec')">取消</button></div>
</div></div>


  <h3>出入库</h3>
  <select id="m-io-type"><option value="入库">入库</option><option value="出库">出库</option></select>
  <select id="m-io-ing"></select>
  <input type="number" id="m-io-qty" placeholder="数量" step="0.01">
  <input type="date" id="m-io-date">
  <input id="m-io-note" placeholder="备注">
  <div class="row"><button class="btn btn-o btn-block" onclick="saveStockIO()">保存</button><button class="btn btn-o1 btn-block" onclick="closeModal('modal-stock-io')">取消</button></div>
</div></div>

<script>
// ====== DATABASE ======
const DB_NAME='hotpot_db',DB_VER=1;
let db;
function openDB(){return new Promise((r,j)=>{
  const req=indexedDB.open(DB_NAME,DB_VER);
  req.onupgradeneeded=e=>{
    const d=e.target.result;
    if(!d.objectStoreNames.contains('sz'))d.createObjectStore('sz',{keyPath:'id',autoIncrement:true});
    if(!d.objectStoreNames.contains('yg'))d.createObjectStore('yg',{keyPath:'id',autoIncrement:true});
    if(!d.objectStoreNames.contains('leave'))d.createObjectStore('leave',{keyPath:'id',autoIncrement:true});
    if(!d.objectStoreNames.contains('attend'))d.createObjectStore('attend',{keyPath:'id',autoIncrement:true});
    if(!d.objectStoreNames.contains('ingredient'))d.createObjectStore('ingredient',{keyPath:'id',autoIncrement:true});
    if(!d.objectStoreNames.contains('product'))d.createObjectStore('product',{keyPath:'id',autoIncrement:true});
    if(!d.objectStoreNames.contains('bom'))d.createObjectStore('bom',{keyPath:'id',autoIncrement:true});
    if(!d.objectStoreNames.contains('stockio'))d.createObjectStore('stockio',{keyPath:'id',autoIncrement:true});
    if(!d.objectStoreNames.contains('prodrec'))d.createObjectStore('prodrec',{keyPath:'id',autoIncrement:true});
    if(!d.objectStoreNames.contains('budget'))d.createObjectStore('budget',{keyPath:'id',autoIncrement:true});
  };
  req.onsuccess=e=>{db=e.target.result;r(db)};
  req.onerror=j;
})}
function dbAdd(store,data){return new Promise((r,j)=>{const t=db.transaction(store,'readwrite').objectStore(store);const req=t.add(data);req.onsuccess=()=>r(req.result);req.onerror=j})}
function dbPut(store,data){return new Promise((r,j)=>{const t=db.transaction(store,'readwrite').objectStore(store);const req=t.put(data);req.onsuccess=()=>r(req.result);req.onerror=j})}
function dbGetAll(store){return new Promise((r,j)=>{const t=db.transaction(store,'readonly').objectStore(store);const req=t.getAll();req.onsuccess=()=>r(req.result);req.onerror=j})}
function dbGet(store,id){return new Promise((r,j)=>{const t=db.transaction(store,'readonly').objectStore(store);const req=t.get(id);req.onsuccess=()=>r(req.result);req.onerror=j})}
function dbDelete(store,id){return new Promise((r,j)=>{const t=db.transaction(store,'readwrite').objectStore(store);t.delete(id);t.oncomplete=()=>r();t.onerror=j})}
function dbClear(store){return new Promise((r,j)=>{const t=db.transaction(store,'readwrite').objectStore(store);t.clear();t.oncomplete=()=>r();t.onerror=j})}

// ====== UTILS ======
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2000)}
function fmt(n){return n==null?'-':Number(n).toFixed(2)}
function fmtDate(d){if(!d)return'';const dt=new Date(d);return dt.toLocaleDateString('zh-CN')}
function getMonth(d){if(!d)return'';return d.substring(0,7)}
function closeModal(id){document.getElementById(id).classList.remove('show')}
function openModal(id){document.getElementById(id).classList.add('show')}

// ====== NAVIGATION ======
function switchTab(t){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById('tab-'+t).classList.add('active');
  document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));
  const btns=document.querySelectorAll('nav button');
  const idx={sz:0,yg:1,kc:2,bb:3}[t];
  if(idx!=null)btns[idx].classList.add('active');
  if(t==='sz')loadSZList();
  if(t==='yg'){loadYGList();document.getElementById('yg-subtabs').querySelectorAll('button')[0].click()}
  if(t==='kc'){loadKCIngredients();document.getElementById('kc-subtabs').querySelectorAll('button')[0].click()}
  if(t==='bb'){document.getElementById('bb-subtabs').querySelectorAll('button')[0].click();loadReport()}
}

// ====== TAB 1: 收支管理 ======
async function loadSZList(){
  const data=await dbGetAll('sz');
  const type=document.getElementById('sz-filter-type').value;
  const month=document.getElementById('sz-filter-month').value;
  let items=data.sort((a,b)=>b.date>b.date?1:-1);
  const search=document.getElementById('sz-search').value.toLowerCase();
  if(search)items=items.filter(i=>(i.cat||'').includes(search)||(i.note||'').includes(search)||(i.person||'').includes(search)||(i.pay||'').includes(search));
  if(type)items=items.filter(i=>i.type===type);
  if(month)items=items.filter(i=>getMonth(i.date)===month);

  let totalIn=0,totalOut=0;
  items.forEach(i=>{if(i.type==='收入')totalIn+=i.amount;else totalOut+=i.amount});
  // Check budget
  const budgets=await dbGetAll('budget');
  const thisBudget=budgets.find(b=>b.month===month);
  const budgetEl=document.getElementById('sz-budget');
  if(thisBudget){budgetEl.innerHTML=`月预算: ¥${fmt(thisBudget.amount)} | 已用: ¥${fmt(totalOut)} | ${totalOut>thisBudget.amount?'<span style=\"color:var(--r)\">超支!</span>':'<span style=\"color:var(--g)\">剩余 ¥'+fmt(thisBudget.amount-totalOut)+'</span>'}`}
  else{budgetEl.innerHTML='月预算:未设 <span style=\"color:var(--b);font-size:.7rem\">点击设置</span>'};
  document.getElementById('sz-in').textContent=fmt(totalIn);
  document.getElementById('sz-out').textContent=fmt(totalOut);
  document.getElementById('sz-bal').textContent=fmt(totalIn-totalOut);
  document.getElementById('sz-bal').style.color=totalIn>=totalOut?'var(--g)':'var(--r)';

  const list=document.getElementById('sz-list');
  if(!items.length){list.innerHTML='<div class="empty">暂无收支记录</div>';return}
  list.innerHTML=items.map(i=>`
    <div class="list-item" onclick="editSZ(${i.id})">
      <div class="info">
        <div class="title"><span class="badge ${i.type==='收入'?'badge-in':'badge-out'}">${i.type}</span> ${i.cat||''}</div>
        <div class="sub">${fmtDate(i.date)}${i.pay?' · '+i.pay:''} · ${i.person||''}</div>
      </div>
      <div class="val ${i.type==='收入'?'in':'out'}">${i.type==='收入'?'+':'-'}¥${fmt(i.amount)}</div>
    </div>`).join('');
}

function updateSZCat(){
  const type=document.getElementById('m-sz-type').value;
  const catSelect=document.getElementById('m-sz-cat');
  const incomeCats=['营业收入','其他收入'];
  const expenseCats=['食材采购','设备维修','水电费','工资支出','房租','其他支出'];
  const cats=type==='收入'?incomeCats:type==='支出'?expenseCats:['请先选择类型'];
  catSelect.innerHTML=cats.map(c=>`<option value="${c}">${c}</option>`).join('');
}

// Attendance
async function loadAttendList(){
  const ygs=await dbGetAll('yg');
  const leaves=await dbGetAll('leave');
  const attends=await dbGetAll('attend');
  const now=new Date();const ym=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');
  const daysInMonth=new Date(now.getFullYear(),now.getMonth()+1,0).getDate();

  const list=document.getElementById('yg-attend-list');
  list.innerHTML='<div class="card"><h3>'+ym+' 月考勤</h3>'+ygs.map(yg=>{
    const ygLeaves=leaves.filter(l=>l.empId===yg.id&&getMonth(l.startDate)===ym);
    const leaveDays=ygLeaves.reduce((s,l)=>s+(l.days||0),0);
    const actualDays=daysInMonth-leaveDays;
    const dailySalary=yg.salary/daysInMonth;
    const totalSalary=dailySalary*actualDays;
    return `<div class="list-item">
      <div class="info"><div class="title">${yg.name}</div><div class="sub">应出勤${daysInMonth}天 · 请假${leaveDays}天 · 实到${actualDays}天 · 日薪¥${fmt(dailySalary)}</div></div>
      <div class="val" style="color:var(--o)">¥${fmt(totalSalary)}</div></div>`;
  }).join('')+'</div>';
}

  document.getElementById('yg-fab').style.display=t==='attend'?'none':'flex';
  document.getElementById('yg-fab').onclick=t==='info'?()=>openYGModal():()=>openModal('modal-leave');
  const btns=document.getElementById('yg-subtabs').querySelectorAll('button');

  if(t==='info')loadYGList();
  if(t==='leave'){loadLeaveList();loadYGDropdowns()}
  if(t==='attend')loadAttendList();
}

  if(!qty){toast('请输入数量');return}
  // Update ingredient stock
  const ing=await dbGet('ingredient',ingId);

  await dbAdd('stockio',{ingredientId:ingId,type,qty,date:document.getElementById('m-io-date').value,note:document.getElementById('m-io-note').value.trim()});
  closeModal('modal-stock-io');loadKCIngredients();toast(type+'成功');

// Production Record
async function openProdRecModal(){
  const products=await dbGetAll('product');
  document.getElementById('m-prodrec-prod').innerHTML='<option value="">选择产品</option>'+products.map(e=>`<option value="${e.id}">${e.name}</option>`).join('');
  document.getElementById('m-prodrec-qty').value='';
  document.getElementById('m-prodrec-date').value=new Date().toISOString().split('T')[0];
  document.getElementById('m-prodrec-note').value='';
  document.getElementById('m-prodrec-cost-preview').textContent='';
  openModal('modal-prodrec');
  document.getElementById('m-prodrec-prod').onchange=previewProdCost;
  document.getElementById('m-prodrec-qty').oninput=previewProdCost;
}
async function previewProdCost(){
  const prodId=parseInt(document.getElementById('m-prodrec-prod').value);
  const qty=parseInt(document.getElementById('m-prodrec-qty').value)||0;
  if(!prodId||!qty){document.getElementById('m-prodrec-cost-preview').textContent='';return}
  const boms=await dbGetAll('bom');
  const ingredients=await dbGetAll('ingredient');
  const product=await dbGet('product',prodId);
  const relatedBOMs=boms.filter(b=>b.productId===prodId);
  let totalCost=0;
  let details=[];
  for(const b of relatedBOMs){
    const ing=ingredients.find(i=>i.id===b.ingredientId);
    if(ing){
      const use=(b.qty||0)*qty;
      const unitPrice=10;
      const cost=use*unitPrice;
      totalCost+=cost;
      details.push(`${ing.name}:${use}${b.unit||''}`);
    }
  }
  const unitCost=qty>0?totalCost/qty:0;
  document.getElementById('m-prodrec-cost-preview').innerHTML=`
    消耗食材: ${details.join(' · ')||'无配方数据'}<br>
    预估总成本: ¥${totalCost.toFixed(2)} | 单位成本: ¥${unitCost.toFixed(2)}/份
    ${product&&product.price?` | 售价: ¥${product.price} | 毛利率: ${((product.price-unitCost)/product.price*100).toFixed(1)}%`:''}`;
}
async function saveProdRec(){
  const prodId=parseInt(document.getElementById('m-prodrec-prod').value)||0;
  const qty=parseInt(document.getElementById('m-prodrec-qty').value)||0;
  if(!prodId||!qty){toast('请选择产品并输入数量');return}
  const product=await dbGet('product',prodId);
  const date=document.getElementById('m-prodrec-date').value;
  const boms=await dbGetAll('bom');
  const relatedBOMs=boms.filter(b=>b.productId===prodId);
  let totalCost=0;
  for(const b of relatedBOMs){
    const ing=await dbGet('ingredient',b.ingredientId);
    if(ing){
      const consume=(b.qty||0)*qty;
      const newStock=Math.max(0,(ing.currentStock||0)-consume);
      ing.currentStock=newStock;
      await dbPut('ingredient',ing);
      await dbAdd('stockio',{ingredientId:b.ingredientId,type:'出库',qty:consume,date,note:'生产'+product.name+'自动扣减'});
      totalCost+=consume*10;
    }
  }
  await dbAdd('prodrec',{productId:prodId,productName:product?product.name:'',qty,date,note:document.getElementById('m-prodrec-note').value.trim(),estimatedCost:totalCost});
  closeModal('modal-prodrec');loadProdRecList();loadKCIngredients();toast('已保存，食材自动扣减');
}
async function loadProdRecList(){
  const items=await dbGetAll('prodrec');
  const list=document.getElementById('kc-prodrec-list');
  if(!items.length){list.innerHTML='<div class="empty">暂无生产记录</div>';return}
  list.innerHTML=items.sort((a,b)=>b.date>a.date?1:-1).map(i=>`
    <div class="list-item">
      <div class="info"><div class="title">${i.productName||''} ×${i.qty||0}</div><div class="sub">${fmtDate(i.date)} · 预估成本:¥${fmt(i.estimatedCost)} ${i.note||''}</div></div>
      <button class="btn btn-sm btn-r" onclick="deleteProdRec(${i.id})">删</button></div>`).join('');
}
async function deleteProdRec(id){if(confirm('确认删除？已扣减食材不会自动恢复')){await dbDelete('prodrec',id);loadProdRecList();toast('已删除')}}


async function setBudget(){
  const now=new Date().toISOString().split('T')[0].substring(0,7);
  document.getElementById('m-budget-month').value=now;
  document.getElementById('m-budget-amt').value='';
  const budgets=await dbGetAll('budget');
  const existing=budgets.find(b=>b.month===now);
  if(existing)document.getElementById('m-budget-amt').value=existing.amount;
  openModal('modal-budget');
}
async function saveBudget(){
  const month=document.getElementById('m-budget-month').value;
  const amount=parseFloat(document.getElementById('m-budget-amt').value)||0;
  if(!month||!amount){toast('请选择月份和金额');return}
  const budgets=await dbGetAll('budget');
  const existing=budgets.find(b=>b.month===month);
  if(existing){existing.amount=amount;await dbPut('budget',existing)}
  else{await dbAdd('budget',{month,amount})}
  closeModal('modal-budget');loadSZList();toast('预算已保存');
}

// ====== TAB 4: 报表 ======
async function loadReport(){
  const month=document.getElementById('bb-month').value||new Date().toISOString().split('T')[0].substring(0,7);
  const activeBtns=document.getElementById('bb-subtabs').querySelectorAll('button.active');
  const activeTab=activeBtns.length?activeBtns[0].textContent:'收支月报';
  const container=document.getElementById('bb-content');

  if(activeTab.includes('收支')){
    const items=(await dbGetAll('sz')).filter(i=>getMonth(i.date)===month);
    let inAmt=0,outAmt=0;
    items.forEach(i=>{if(i.type==='收入')inAmt+=i.amount;else outAmt+=i.amount});
    const byCat={};
    items.forEach(i=>{const k=i.cat||'其他';byCat[k]=(byCat[k]||0)+i.amount});
    container.innerHTML=`<div class="summary">
      <div><div class="num" style="color:var(--g)">¥${fmt(inAmt)}</div><div class="lbl">总收入</div></div>
      <div><div class="num" style="color:var(--r)">¥${fmt(outAmt)}</div><div class="lbl">总支出</div></div>
      <div><div class="num" style="color:${inAmt>=outAmt?'var(--g)':'var(--r)'}">¥${fmt(inAmt-outAmt)}</div><div class="lbl">盈亏</div></div>
    </div>
    <div class="card"><h3>分类统计</h3>${Object.entries(byCat).map(([k,v])=>`<div class="list-item"><span>${k}</span><span class="val">¥${fmt(v)}</span></div>`).join('')}</div>
    <div class="card"><h3>流水明细</h3>${items.length?items.sort((a,b)=>b.date>a.date?1:-1).map(i=>`<div class="list-item"><div class="info"><div class="title"><span class="badge ${i.type==='收入'?'badge-in':'badge-out'}">${i.type}</span> ${i.cat||''}</div><div class="sub">${i.date} · ${i.person||''}</div></div><div class="val ${i.type==='收入'?'in':'out'}">¥${fmt(i.amount)}</div></div>`).join(''):'<div class="empty">本月无记录</div>'}</div>`;
  }else if(activeTab.includes('薪资')){
    const ygs=await dbGetAll('yg');
    const leaves=await dbGetAll('leave');
    const days=new Date(parseInt(month.split('-')[0]),parseInt(month.split('-')[1]),0).getDate();
    container.innerHTML='<div class="card"><h3>'+month+' 薪资报表</h3>'+ygs.map(yg=>{
      const ygLeaves=leaves.filter(l=>l.empId===yg.id&&getMonth(l.startDate)===month);
      const leaveDays=ygLeaves.reduce((s,l)=>s+(l.days||0),0);
      const actual=days-leaveDays;
      const salary=yg.salary/days*actual;
      return `<div class="list-item"><div class="info"><div class="title">${yg.name} (${yg.role||''})</div><div class="sub">出勤${actual}天 · 请假${leaveDays}天 · 日薪¥${fmt(yg.salary/days)}</div></div><div class="val" style="color:var(--o)">¥${fmt(salary)}</div></div>`;
    }).join('')+'</div>';
  }else if(activeTab.includes('库存')){
    const items=await dbGetAll('ingredient');
    const ios=await dbGetAll('stockio');
    container.innerHTML='<div class="card"><h3>食材库存台账 ('+month+')</h3>'+items.map(i=>{
      const monthIOs=ios.filter(io=>io.ingredientId===i.id&&getMonth(io.date)===month);
      const inQty=monthIOs.filter(io=>io.type==='入库').reduce((s,io)=>s+(io.qty||0),0);
      const outQty=monthIOs.filter(io=>io.type==='出库').reduce((s,io)=>s+(io.qty||0),0);
      return `<div class="list-item"><div class="info"><div class="title">${i.name}</div><div class="sub">入库${inQty}${i.unit||''} · 出库${outQty}${i.unit||''} · 当前库存${i.currentStock||0}${i.unit||''}</div></div><div class="val" style="color:${(i.currentStock||0)<=0?'var(--r)':'var(--g)'}">${i.currentStock||0}${i.unit||''}</div></div>`;
    }).join('')+'</div>';
  }
}

function bbSubTab(t){
  const btns=document.getElementById('bb-subtabs').querySelectorAll('button');
  btns.forEach(b=>b.classList.remove('active'));
  const map={sz:0,salary:1,stock:2};
  btns[map[t]||0].classList.add('active');
  loadReport();
}


// ====== LOGIN ======
const CORRECT_PIN='123456';
let loginInput='';
function renderNumpad(){
  const pad=document.getElementById('loginNumpad');
  const nums=[1,2,3,4,5,6,7,8,9,'empty','0','del'];
  pad.innerHTML=nums.map(n=>{
    if(n==='empty')return'<button class="empty"></button>';
    if(n==='del')return'<button class="del" onclick="loginDel()">删除</button>';
    return`<button onclick="loginTap(${n})">${n}</button>`;
  }).join('');
}
function loginTap(n){
  if(loginInput.length>=6)return;
  loginInput+=n;
  updateDots();
  if(loginInput.length===6)checkLogin();
}
function loginDel(){loginInput=loginInput.slice(0,-1);updateDots();document.getElementById('loginMsg').textContent='';}
function updateDots(){
  const dots=document.querySelectorAll('#loginDots .login-dot');
  dots.forEach((d,i)=>{d.classList.toggle('filled',i<loginInput.length)});
}
function checkLogin(){
  if(loginInput===CORRECT_PIN){
    document.getElementById('loginPage').classList.add('hidden');
    document.getElementById('loginMsg').textContent='';
    afterLogin();
  }else{
    document.getElementById('loginMsg').textContent='密码错误';
    setTimeout(()=>{loginInput='';updateDots();document.getElementById('loginMsg').textContent=''},800);
  }
}
renderNumpad();
// Auto-login if previously authenticated
if(sessionStorage.getItem('loggedIn')==='1'){
  document.getElementById('loginPage').classList.add('hidden');
  initApp();
}
// Save login state on success
function afterLogin(){
  sessionStorage.setItem('loggedIn','1');
  initApp();
}

// Auto-login if already passed (PWA)
if(sessionStorage.getItem('loggedIn')==='1'){
  document.getElementById('loginPage').classList.add('hidden');
  initApp();
}


// ====== INIT ======
async function initApp(){
  try {
    await openDB();
    const now=new Date().toISOString().split('T')[0].substring(0,7);
    document.getElementById('sz-filter-month').value=now;
    document.getElementById('bb-month').value=now;
    document.getElementById('m-sz-date').value=new Date().toISOString().split('T')[0];
    loadSZList();
    setInterval(()=>{document.getElementById('clock').textContent=new Date().toLocaleTimeString('zh-CN',{hour12:false})},1000);
  } catch(e) {
    console.error(e);
    setTimeout(()=>initApp(), 500);
  }
}
