<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#C41E1E">
<title>七喜呱呱老火锅（宁武店）v3</title>
<link rel="manifest" href="manifest.json">
<script>if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js')</script>
<style>
:root{--o:#C41E1E;--g:#4caf84;--b:#5b9cf5;--r:#f05b5b;--bg:#f5f5f5;--card:#fff;--t:#333;--d:#999}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--t);padding-bottom:60px;max-width:100vw;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
header{background:linear-gradient(135deg,#8B0000,#C41E1E);color:#fff;padding:10px 14px;position:sticky;top:0;z-index:10;display:flex;justify-content:space-between;align-items:center}
header h1{font-size:1rem;font-weight:600}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;border-top:1px solid #eee;z-index:10;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;padding:6px 2px;border:none;background:none;color:var(--d);font-size:.62rem;display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer;transition:color .2s}
nav button.active{color:var(--o)}
nav button .icon{font-size:1.2rem}
.page{display:none;padding:10px}
.page.active{display:block}
.card{background:var(--card);border-radius:10px;padding:12px;margin-bottom:8px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.card h3{font-size:.85rem;margin-bottom:6px;color:var(--o)}
.row{display:flex;gap:6px;flex-wrap:wrap}
.row>*{flex:1;min-width:60px}
input,select,textarea{width:100%;padding:7px 8px;border:1px solid #ddd;border-radius:6px;font-size:.82rem;background:#fafafa;margin-bottom:6px}
input:focus,select:focus{outline:none;border-color:var(--o);background:#fff}
.btn{display:inline-block;padding:7px 14px;border:none;border-radius:6px;font-size:.78rem;font-weight:600;cursor:pointer;text-align:center;transition:opacity .15s}
.btn:active{opacity:.7}
.btn-o{background:var(--o);color:#fff}
.btn-g{background:var(--g);color:#fff}
.btn-b{background:var(--b);color:#fff}
.btn-r{background:var(--r);color:#fff}
.btn-o1{border:1px solid var(--o);color:var(--o);background:#fff}
.btn-block{display:block;width:100%}
.btn-sm{padding:4px 8px;font-size:.68rem}
.list-item{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #f0f0f0;font-size:.8rem}
.list-item:last-child{border-bottom:none}
.list-item .info{flex:1;min-width:0}
.list-item .title{font-weight:600;font-size:.82rem}
.list-item .sub{font-size:.68rem;color:var(--d);margin-top:1px}
.list-item .val{font-weight:600;text-align:right;min-width:50px;font-size:.85rem}
.list-item .val.in{color:var(--g)}
.list-item .val.out{color:var(--r)}
.badge{display:inline-block;padding:1px 7px;border-radius:10px;font-size:.62rem;font-weight:600}
.badge-in{background:#4caf8415;color:var(--g)}
.badge-out{background:#f05b5b15;color:var(--r)}
.badge-warn{background:#ff6b3515;color:#ff6b35}
.summary{display:flex;gap:6px;margin-bottom:10px}
.summary>div{flex:1;background:var(--card);border-radius:8px;padding:8px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.summary .num{font-size:1.1rem;font-weight:700}
.summary .lbl{font-size:.58rem;color:var(--d);margin-top:1px}
.empty{text-align:center;padding:30px 15px;color:var(--d);font-size:.8rem}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:100;align-items:flex-end}
.modal-overlay.show{display:flex}
.modal{background:#fff;width:100%;border-radius:14px 14px 0 0;padding:14px;max-height:85vh;overflow-y:auto}
.modal h3{font-size:.9rem;margin-bottom:10px;text-align:center;color:var(--o)}
.fab{position:fixed;bottom:75px;right:14px;width:44px;height:44px;border-radius:50%;background:var(--o);color:#fff;font-size:1.3rem;border:none;box-shadow:0 3px 10px rgba(196,30,30,.4);cursor:pointer;z-index:5;display:flex;align-items:center;justify-content:center}
.filter-row{display:flex;gap:6px;align-items:center;margin-bottom:8px}
.filter-row select,.filter-row input{width:auto;flex:1;margin-bottom:0}
.tab-row{display:flex;gap:3px;margin-bottom:8px;overflow-x:auto}
.tab-row button{padding:5px 12px;border:1px solid #ddd;border-radius:14px;background:#fff;font-size:.7rem;white-space:nowrap;cursor:pointer}
.tab-row button.active{background:var(--o);color:#fff;border-color:var(--o)}
.toast{position:fixed;top:60px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:6px 18px;border-radius:18px;font-size:.75rem;z-index:200;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}
.login-page{position:fixed;inset:0;z-index:1000;background:url(bg_login.jpg) center/cover no-repeat;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff}
.login-overlay{position:absolute;inset:0;background:linear-gradient(180deg,rgba(139,0,0,.75),rgba(150,30,30,.7),rgba(0,0,0,.5))}
.login-page.hidden{display:none}
.login-card{position:relative;z-index:1;background:rgba(0,0,0,.4);backdrop-filter:blur(8px);border-radius:16px;padding:28px 20px;width:calc(100% - 40px);max-width:320px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.1)}
.login-emoji{font-size:3rem;margin-bottom:6px}
.login-card h2{font-size:1.2rem;margin-bottom:2px;font-weight:700}
.login-card .sub{font-size:.65rem;color:rgba(255,255,255,.55);margin-bottom:16px}
.login-dots{display:flex;justify-content:center;gap:10px;margin-bottom:16px}
.login-dot{width:12px;height:12px;border-radius:50%;border:2px solid rgba(255,255,255,.4);transition:all .2s}
.login-dot.filled{background:#FFD700;border-color:#FFD700;box-shadow:0 0 10px rgba(255,215,0,.4)}
.login-numpad{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:10px}
.login-numpad button{aspect-ratio:1.2;border-radius:50%;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);color:#fff;font-size:1.2rem;font-weight:600;cursor:pointer;transition:all .15s}
.login-numpad button:active{background:rgba(255,255,255,.25);transform:scale(.95)}
.login-numpad .del{font-size:.7rem}
.login-numpad .empty{background:transparent;border:none;pointer-events:none}
.login-msg{font-size:.65rem;color:#FFD700;min-height:18px}
</style>
</head>

<div class="modal-overlay" id="modal-kc-ing"><div class="modal">

</div></div>

<script>
// ====== DATABASE (Supabase) ======
const SB_URL='https://dzmyonfsztrpvuicgtjm.supabase.co/rest/v1';
const SB_KEY='sb_publishable_oLSyHseKehgHTc6W_qB8XA_wVBvwGPv';
const SB_HEADERS={'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json'};
async function odb(){return true} // no-op for Supabase
async function dba(s,d){const r=await fetch(SB_URL+'/'+s,{method:'POST',headers:{...SB_HEADERS,'Prefer':'return=representation'},body:JSON.stringify(d)});const j=await r.json();return Array.isArray(j)?j[0]?.id:j?.id}
async function dbp(s,d){const id=d.id;delete d.id;await fetch(SB_URL+'/'+s+'?id=eq.'+id,{method:'PATCH',headers:{...SB_HEADERS,'Prefer':'return=representation'},body:JSON.stringify(d)});return id}
async function dbg(s){const r=await fetch(SB_URL+'/'+s+'?select=*&order=id.desc',{headers:SB_HEADERS});return await r.json()}
async function db1(s,i){const r=await fetch(SB_URL+'/'+s+'?id=eq.'+i+'&select=*',{headers:SB_HEADERS});const j=await r.json();return j?.[0]}
async function dbd(s,i){await fetch(SB_URL+'/'+s+'?id=eq.'+i,{method:'DELETE',headers:SB_HEADERS})}

// ====== UI HELPERS ======
function t(m){const e=document.getElementById('toast');e.textContent=m;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1800)}
function f(n){return n==null||isNaN(n)?'0.00':Number(n).toFixed(2)}
function fd(d){if(!d)return'';return new Date(d).toLocaleDateString('zh-CN')}
function gm(d){return d?d.substring(0,7):''}
function closeModal(id){document.getElementById(id).classList.remove('show')}
function openModal(id){document.getElementById(id).classList.add('show')}

// ====== TABS ======
function switchTab(t){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById('tab-'+t).classList.add('active');
  document.querySelectorAll('nav button').forEach((b,i)=>{b.classList.toggle('active',{sz:0,yg:1,kc:2,bb:3}[t]===i)});
  if(t==='sz')loadSZList();
  if(t==='yg'){loadYGList();document.querySelectorAll('#yg-subtabs button')[0].click()}
  if(t==='kc'){loadKCIngredients();document.querySelectorAll('#kc-subtabs button')[0].click()}
  if(t==='bb'){document.querySelectorAll('#bb-subtabs button')[0].click();loadReport()}
}

// ====== TAB 1: 收支 ======
async function loadSZList(){
  const data=await dbg('sz');
  const type=document.getElementById('sz-filter-type').value;
  const month=document.getElementById('sz-filter-month').value;
  const search=(document.getElementById('sz-search').value||'').toLowerCase();
  let items=data.sort((a,b)=>b.date>a.date?1:-1);
  if(type)items=items.filter(i=>i.type===type);
  if(month)items=items.filter(i=>gm(i.date)===month);
  if(search)items=items.filter(i=>(i.cat||'').includes(search)||(i.note||'').includes(search)||(i.person||'').includes(search));
  let ti=0,to=0;items.forEach(i=>{if(i.type==='收入')ti+=i.amount;else to+=i.amount});
  document.getElementById('sz-in').textContent=f(ti);
  document.getElementById('sz-out').textContent=f(to);
  document.getElementById('sz-bal').textContent=f(ti-to);

  const rb=boms.filter(b=>b.productId===pid);if(!rb.length){preview.innerHTML='该产品暂无配方';return}
  let details=[];rb.forEach(b=>{const ing=ings.find(i=>i.id===b.ingredientId);if(ing)details.push(`${ing.name}:${(b.qty||0)*qty}${b.unit||''}`)});
  preview.innerHTML='消耗: '+details.join(' · ')+`<br>预计${qty}份${prod?` · 售价¥${prod.price}/份`:' · 成本待核算'}`;

  const prod=await db1('product',pid);const boms=await dbg('bom');const date=document.getElementById('m-prodrec-date').value;
  let totalCost=0;
  for(const b of boms.filter(b=>b.productId===pid)){
    const ing=await db1('ingredient',b.ingredientId);if(ing){const consume=(b.qty||0)*qty;ing.currentStock=Math.max(0,(ing.currentStock||0)-consume);await dbp('ingredient',ing);await dba('stockio',{ingredientId:b.ingredientId,type:'出库',qty:consume,date,note:'生产'+prod.name+'自动扣减'});totalCost+=consume*5}
  }
  await dba('prodrec',{productId:pid,productName:prod?prod.name:'',qty,date,note:document.getElementById('m-prodrec-note').value.trim(),estimatedCost:totalCost});
  closeModal('modal-prodrec');loadProdRecList();loadKCIngredients();t('已保存，食材已扣减');
}
async function deleteProdRec(id){if(confirm('确认删除？已扣减食材不会恢复')){await dbd('prodrec',id);loadProdRecList();t('已删除')}}

// ====== TAB 4: 报表 ======
async function loadReport(){
  const month=document.getElementById('bb-month').value||new Date().toISOString().split('T')[0].substring(0,7);
  const active=document.querySelector('#bb-subtabs button.active');const tab=active?active.textContent:'收支月报';const c=document.getElementById('bb-content');
  if(tab.includes('收支')){
    const items=(await dbg('sz')).filter(i=>gm(i.date)===month);let ti=0,to=0;items.forEach(i=>{if(i.type==='收入')ti+=i.amount;else to+=i.amount});
    const byCat={};items.forEach(i=>{const k=i.cat||'其他';byCat[k]=(byCat[k]||0)+i.amount});
    c.innerHTML=`<div class="summary"><div><div class="num" style="color:var(--g)">¥${f(ti)}</div><div class="lbl">总收入</div></div><div><div class="num" style="color:var(--r)">¥${f(to)}</div><div class="lbl">总支出</div></div><div><div class="num" style="color:${ti>=to?'var(--g)':'var(--r)'}">¥${f(ti-to)}</div><div class="lbl">盈亏</div></div></div><div class="card"><h3>分类汇总</h3>${Object.entries(byCat).map(([k,v])=>`<div class="list-item"><span>${k}</span><span class="val">¥${f(v)}</span></div>`).join('')||'<div class="empty">无数据</div>'}</div><div class="card"><h3>流水明细</h3>${items.length?items.sort((a,b)=>b.date>a.date?1:-1).map(i=>`<div class="list-item"><div class="info"><div class="title"><span class="badge ${i.type==='收入'?'badge-in':'badge-out'}">${i.type}</span> ${i.cat||''}</div><div class="sub">${i.date} · ${i.person||''} ${i.note||''}</div></div><div class="val ${i.type==='收入'?'in':'out'}">¥${f(i.amount)}</div></div>`).join(''):'<div class="empty">本月无记录</div>'}</div>`;
  }else if(tab.includes('薪资')){
    const ygs=await dbg('yg');const leaves=await dbg('leave');const dim=new Date(parseInt(month.split('-')[0]),parseInt(month.split('-')[1]),0).getDate();
    c.innerHTML='<div class="card"><h3>'+month+' 薪资报表</h3>'+ygs.map(yg=>{const yl=leaves.filter(l=>l.empId===yg.id&&gm(l.startDate)===month);const ld=yl.reduce((s,l)=>s+(l.days||0),0);const ad=dim-ld;const sal=yg.salary/dim*ad;return`<div class="list-item"><div class="info"><div class="title">${yg.name} (${yg.role||''})</div><div class="sub">出勤${ad}天 · 请假${ld}天</div></div><div class="val" style="color:var(--o)">¥${f(sal)}</div></div>`}).join('')+'</div>';
  }else if(tab.includes('库存')){
    const items=await dbg('ingredient');const ios=await dbg('stockio');
    c.innerHTML='<div class="card"><h3>库存台账 ('+month+')</h3>'+items.map(i=>{const mi=ios.filter(io=>io.ingredientId===i.id&&gm(io.date)===month);const iq=mi.filter(io=>io.type==='入库').reduce((s,io)=>s+(io.qty||0),0);const oq=mi.filter(io=>io.type==='出库').reduce((s,io)=>s+(io.qty||0),0);return`<div class="list-item"><div class="info"><div class="title">${i.name}</div><div class="sub">入${iq} · 出${oq} · 库存${i.currentStock||0}${i.unit||''}</div></div><div class="val">${i.currentStock||0}${i.unit||''}</div></div>`}).join('')+'</div>';
  }
}
function bbSubTab(t){const btns=document.querySelectorAll('#bb-subtabs button');btns.forEach(b=>b.classList.remove('active'));btns[{sz:0,salary:1,stock:2}[t]].classList.add('active');loadReport()}

// Budget
async function setBudget(){const now=new Date().toISOString().split('T')[0].substring(0,7);document.getElementById('m-budget-month').value=now;document.getElementById('m-budget-amt').value='';const bs=await dbg('budget');const ex=bs.find(b=>b.month===now);if(ex)document.getElementById('m-budget-amt').value=ex.amount;openModal('modal-budget')}
async function saveBudget(){const month=document.getElementById('m-budget-month').value;const amt=parseFloat(document.getElementById('m-budget-amt').value)||0;if(!month||!amt){t('请选择月份和金额');return}const bs=await dbg('budget');const ex=bs.find(b=>b.month===month);if(ex){ex.amount=amt;await dbp('budget',ex)}else{await dba('budget',{month,amount:amt})}closeModal('modal-budget');loadSZList();t('预算已保存')}

// CSV Export
async function exportCSV(){const data=await dbg('sz');let csv='﻿类型,分类,金额,日期,支付方式,经手人,备注\n';data.forEach(i=>{csv+=`${i.type},${i.cat||''},${i.amount},${i.date||''},${i.pay||''},${i.person||''},${i.note||''}\n`});const b=new Blob([csv],{type:'text/csv'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='收支数据_'+new Date().toISOString().split('T')[0]+'.csv';a.click();t('导出成功')}

// ====== LOGIN ======
const PIN='123456';let loginInput='';
function renderNumpad(){var p=document.getElementById('loginNumpad');if(!p)return;p.innerHTML='';for(var i=1;i<=9;i++){var b=document.createElement('button');b.textContent=i;b.onclick=(function(n){return function(){loginTap(n)}})(i);p.appendChild(b)}var eb=document.createElement('button');eb.className='empty';eb.disabled=true;p.appendChild(eb);var zb=document.createElement('button');zb.textContent='0';zb.onclick=function(){loginTap(0)};p.appendChild(zb);var db=document.createElement('button');db.className='del';db.textContent='删除';db.onclick=loginDel;p.appendChild(db)}renderNumpad();
function loginTap(n){if(loginInput.length>=6)return;loginInput+=n;updateDots();if(loginInput.length===6)checkLogin()}
function loginDel(){loginInput=loginInput.slice(0,-1);updateDots();document.getElementById('loginMsg').textContent=''}
function updateDots(){document.querySelectorAll('#loginDots .login-dot').forEach((d,i)=>d.classList.toggle('filled',i<loginInput.length))}
function checkLogin(){if(loginInput===PIN){document.getElementById('loginPage').classList.add('hidden');document.getElementById('loginMsg').textContent='';afterLogin()}else{document.getElementById('loginMsg').textContent='密码错误';setTimeout(()=>{loginInput='';updateDots();document.getElementById('loginMsg').textContent=''},800)}}
function afterLogin(){sessionStorage.setItem('loggedIn','1');initApp()}
if(sessionStorage.getItem('loggedIn')==='1'){document.getElementById('loginPage').classList.add('hidden');initApp()}

// ====== INIT ======
async function initApp(){
  const now=new Date().toISOString().split('T')[0].substring(0,7);
  document.getElementById('sz-filter-month').value=now;
  document.getElementById('bb-month').value=now;
  document.getElementById('m-sz-date').value=new Date().toISOString().split('T')[0];
  loadSZList();
  setInterval(()=>{document.getElementById('clock').textContent=new Date().toLocaleTimeString('zh-CN',{hour12:false})},1000);
}
</script>
